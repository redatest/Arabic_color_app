name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audio generator
        run: python -m pip install --upgrade pip edge-tts
      - name: Generate embedded Arabic audio
        run: python scripts/generate_audio.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ArabicColorApp.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArabicColorApp-APK
          path: ArabicColorApp.apk
          retention-days: 30
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Arabic Color App v1.0.${{ github.run_number }}
          files: ArabicColorApp.apk
          generate_release_notes: true
